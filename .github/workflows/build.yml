name: Build Mod Jar
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: #支持手动点击触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 关键：gradle缓存，加速CI
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Make gradlew可执行
        run: chmod +x ./gradlew

      # 执行构建：clean + build，不会包含任何assets美术资源
      - name: Run Gradle build
        run: ./gradlew clean build

      # 上传构建产物（仅纯代码jar，不含贴图模型！）
      - name: Upload built jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-codeonly
          path: build/libs/*.jar
