name: Build Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup‑java@v4
        with:
          java‑version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup‑python@v5
        with:
          python‑version: '3.12'

      - name: Install libs jars into mavenLocal（原fork本地脚本）
        run: python3 _setup_mavenlocal.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle build
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload‑artifact@v4
        with:
          name: mod‑build‑output
          path: build/libs/*.jar
