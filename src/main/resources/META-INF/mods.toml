modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "aeronautics"
version = "1.3.0"
displayName = "Create Aeronautics"
authors = "Simulated Team"
credits = "RyanHCode, Eriksonn, Cyvack, Bee, Kyan, Cake, Rhyguy1"
description = '''Enables all manner of flying contraptions with hot air, propellers, and magic floating rocks. Sable is bundled in.'''
logoFile = "icon.png"
logoBlur = false

[[mods]]
modId = "sable"
version = "1.0.0"
displayName = "Sable (bundled)"
authors = "RyanHCode"
description = '''Sub-level rendering library, bundled inside Create Aeronautics.'''

[[mods]]
modId = "offroad"
version = "1.3.0"
displayName = "Create Offroad (bundled)"
authors = "Simulated Team"
description = '''Offroad vehicles, bundled inside Create Aeronautics.'''

[[mods]]
modId = "simulated"
version = "1.3.0"
displayName = "Create Simulated (bundled)"
authors = "Simulated Team"
description = '''Physics core, bundled inside Create Aeronautics.'''

["lithium:options"]
"mixin.entity.collisions.unpushable_cramming" = false
"mixin.world.chunk_access" = false
"mixin.world.chunk_ticking" = false
