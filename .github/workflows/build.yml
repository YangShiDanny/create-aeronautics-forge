name: Build Mod Jar
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 手动下载安装 Gradle 7.6.4（ForgeGradle旧版本唯一兼容版本）
      - name: Install Gradle 7.6.4
        run: |
          wget https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
          unzip gradle-7.6.4-bin.zip
          echo "$PWD/gradle-7.6.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 7.6.4
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Run Gradle build
        run: ./gradlew clean build

      - name: Upload built jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-codeonly
          path: build/libs/*.jar
