name: Build Mod

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 全局安装gradle7.6.3，在CI容器现场生成正确版本wrapper
      - name: Setup Global Gradle 7.6.3
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 7.6.3

      - name: Generate Gradle Wrapper 7.6.3 inside CI
        run: gradle wrapper --gradle-version=7.6.3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: CreateAeronautics‑Forge‑1.20.1
          path: build/libs/*.jar
          retention-days: 30
