name: Build Mod

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 安装全局 Gradle，用于现场生成 wrapper
      - name: Setup Gradle (global)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.5 # 和你项目gradle.properties匹配的版本

      # CI临时生成 gradle wrapper（仅CI容器内，不会提交回github仓库）
      - name: Generate Gradle Wrapper on‑the‑fly
        run: gradle wrapper

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: CreateAeronautics‑Forge‑1.20.1
          path: build/libs/*.jar
          retention-days: 30
